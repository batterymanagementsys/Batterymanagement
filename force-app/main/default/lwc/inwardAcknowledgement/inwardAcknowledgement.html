<template>

    <lightning-card title="Inward Acknowledgement">

        <template if:true={isLoading}>

            <div class="slds-p-around_medium">
                <lightning-spinner
                    alternative-text="Loading">
                </lightning-spinner>
            </div>

        </template>


        <template if:true={errorMessage}>

            <div class="slds-p-around_medium
                        slds-text-color_error">

                {errorMessage}

            </div>

        </template>


        <template if:true={acknowledgementData}>

            <div class="slds-p-around_medium">

                <lightning-layout
                    multiple-rows>

                    <lightning-layout-item
                        size="6"
                        padding="around-small">

                        <strong>
                            Acknowledgement
                        </strong>

                        <p>
                            {acknowledgementData.acknowledgement}
                        </p>

                    </lightning-layout-item>


                    <lightning-layout-item
                        size="6"
                        padding="around-small">

                        <strong>
                            Session Number
                        </strong>

                        <p>
                            {acknowledgementData.sessionNumber}
                        </p>

                    </lightning-layout-item>


                    <lightning-layout-item
                        size="6"
                        padding="around-small">

                        <strong>
                            Warehouse
                        </strong>

                        <p>
                            {acknowledgementData.warehouseName}
                        </p>

                    </lightning-layout-item>


                    <lightning-layout-item
                        size="6"
                        padding="around-small">

                        <strong>
                            Operator
                        </strong>

                        <p>
                            {acknowledgementData.operatorName}
                        </p>

                    </lightning-layout-item>


                    <lightning-layout-item
                        size="6"
                        padding="around-small">

                        <strong>
                            Completed Date / Time
                        </strong>

                        <p>

                            <lightning-formatted-date-time
                                value={acknowledgementData.completedDateTime}
                                year="numeric"
                                month="2-digit"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit">
                            </lightning-formatted-date-time>

                        </p>

                    </lightning-layout-item>

                </lightning-layout>


                <hr/>


                <div class="slds-grid
                            slds-wrap
                            slds-gutters
                            slds-m-bottom_medium">

                    <div class="slds-col slds-size_1-of-3">

                        <div class="slds-box">

                            <strong>
                                Accepted
                            </strong>

                            <div class="slds-text-heading_large">
                                {acknowledgementData.acceptedCount}
                            </div>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-3">

                        <div class="slds-box">

                            <strong>
                                Rejected
                            </strong>

                            <div class="slds-text-heading_large">
                                {acknowledgementData.rejectedCount}
                            </div>

                        </div>

                    </div>


                    <div class="slds-col slds-size_1-of-3">

                        <div class="slds-box">

                            <strong>
                                Duplicate
                            </strong>

                            <div class="slds-text-heading_large">
                                {acknowledgementData.duplicateCount}
                            </div>

                        </div>

                    </div>

                </div>


                <!-- ACCEPTED ITEMS -->

                <template if:true={hasAcceptedItems}>

                    <h3 class="slds-text-heading_small
                               slds-m-bottom_small">

                        Accepted Items

                    </h3>

                    <table class="slds-table
                                  slds-table_cell-buffer
                                  slds-table_bordered
                                  slds-m-bottom_large">

                        <thead>

                            <tr>
                                <th>Inward Number</th>
                                <th>Battery</th>
                                <th>QR Code</th>
                                <th>Scan Date</th>
                            </tr>

                        </thead>

                        <tbody>

                            <template
                                for:each={acknowledgementData.acceptedItems}
                                for:item="item">

                                <tr key={item.Id}>

                                    <td>
                                        {item.Name}
                                    </td>

                                    <td>
                                        {item.Battery__r.Name}
                                    </td>

                                    <td>
                                        {item.Scanned_QR__c}
                                    </td>

                                    <td>

                                        <lightning-formatted-date-time
                                            value={item.Scan_Date_Time__c}>
                                        </lightning-formatted-date-time>

                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </template>


                <!-- REJECTED ITEMS -->

                <template if:true={hasRejectedItems}>

                    <h3 class="slds-text-heading_small
                               slds-m-bottom_small">

                        Rejected Items

                    </h3>

                    <table class="slds-table
                                  slds-table_cell-buffer
                                  slds-table_bordered
                                  slds-m-bottom_large">

                        <thead>

                            <tr>
                                <th>Inward Number</th>
                                <th>Battery</th>
                                <th>QR Code</th>
                                <th>Failure Reason</th>
                            </tr>

                        </thead>

                        <tbody>

                            <template
                                for:each={acknowledgementData.rejectedItems}
                                for:item="item">

                                <tr key={item.Id}>

                                    <td>
                                        {item.Name}
                                    </td>

                                    <td>
                                        {item.Battery__r.Name}
                                    </td>

                                    <td>
                                        {item.Scanned_QR__c}
                                    </td>

                                    <td>
                                        {item.Failure_Reason__c}
                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </template>


                <!-- DUPLICATE ITEMS -->

                <template if:true={hasDuplicateItems}>

                    <h3 class="slds-text-heading_small
                               slds-m-bottom_small">

                        Duplicate Items

                    </h3>

                    <table class="slds-table
                                  slds-table_cell-buffer
                                  slds-table_bordered">

                        <thead>

                            <tr>
                                <th>Inward Number</th>
                                <th>Battery</th>
                                <th>QR Code</th>
                                <th>Failure Reason</th>
                            </tr>

                        </thead>

                        <tbody>

                            <template
                                for:each={acknowledgementData.duplicateItems}
                                for:item="item">

                                <tr key={item.Id}>

                                    <td>
                                        {item.Name}
                                    </td>

                                    <td>
                                        {item.Battery__r.Name}
                                    </td>

                                    <td>
                                        {item.Scanned_QR__c}
                                    </td>

                                    <td>
                                        {item.Failure_Reason__c}
                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </template>

            </div>

        </template>

    </lightning-card>

</template>
